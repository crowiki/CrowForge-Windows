<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/crowforge.svg" type="image/svg+xml" />
    <title>CrowForge — Painel Administrativo</title>
    <style>
      :root {
        --bg: #0B0B12;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --text: #e4e6ed;
        --text-muted: #8b8fa3;
        --accent: #7C3AED;
        --accent-hover: #16a34a;
        --danger: #ef4444;
        --warning: #f59e0b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
